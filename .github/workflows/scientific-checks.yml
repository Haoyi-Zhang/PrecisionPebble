name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Allocate raw-output directory
        run: mkdir -p "$RUNNER_TEMP/scientific-output"
      - name: Bounded whole scientific run
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/scientific-output"
          export raw
          timeout --signal=TERM --kill-after=5s 300s bash -euo pipefail <<'CHECKS' 2>&1 | tee "$raw/whole-run.log"
          ulimit -v 3145728
          ulimit -t 240
          python -B -m unittest discover -s tests -v 2>&1 | tee "$raw/unit-tests.log"
          python -B tools/check_controls.py --output "$raw/controls.json" 2>&1 | tee "$raw/controls.log"
          python -B tools/check_reference_equation.py --output "$raw/reference-equation.json" 2>&1 | tee "$raw/reference-equation.log"
          for step in 1 2 3 4 5 6; do
            python -B reproduce.py --output "$raw/replay" --chunk 64 2>&1 | tee "$raw/campaign-$step.log"
          done
          python -B tools/summarize.py --results "$raw/replay" --output "$raw/summary" 2>&1 | tee "$raw/summary.log"
          python -B tools/compare_replay.py --reference results/evaluation --replay "$raw/replay" --output "$raw/comparison.json" 2>&1 | tee "$raw/comparison.log"
          CHECKS
      - name: Finite recipe descriptor controls
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 3145728
          ulimit -t 240
          timeout --signal=TERM --kill-after=5s 30s python -B tests/recipe_descriptor_regression.py -v 2>&1 | tee "$RUNNER_TEMP/scientific-output/recipe-descriptors.log"
      - name: Upload raw outputs on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-output
          path: ${{ runner.temp }}/scientific-output
          if-no-files-found: warn
          retention-days: 14
